<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickfolk</title>

<style>
body {
    margin: 0;
    background: #8fbc70;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    background: #6b8e23;
    color: white;
    margin: 0;
    padding: 20px;
}

.info {
    background: white;
    padding: 15px;
    font-size: 19px;
}

#game {
    position: relative;
    height: 500px;
    overflow: hidden;
}

/* TREES */

.tree {
    position: absolute;
    font-size: 65px;
    cursor: pointer;
}

.tree1 { left: 10%; top: 40px; }
.tree2 { right: 10%; top: 40px; }
.tree3 { left: 15%; bottom: 90px; }
.tree4 { right: 15%; bottom: 90px; }

/* ROCKS */

.rock {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
}

.rock1 { left: 32%; top: 75px; }
.rock2 { right: 32%; top: 75px; }
.rock3 { left: 35%; bottom: 75px; }
.rock4 { right: 35%; bottom: 75px; }

/* FISH */

.fish {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
}

.fish1 {
    left: 5%;
    top: 210px;
}

.fish2 {
    right: 5%;
    top: 210px;
}

/* POND */

.pond {
    position: absolute;
    left: 50%;
    top: 195px;
    transform: translateX(-50%);
    width: 150px;
    height: 70px;
    background: #62a9d8;
    border-radius: 50%;
    border: 4px solid #4682a9;
}

/* STICKFOLK */

.stickman {
    position: absolute;
    left: 50%;
    top: 165px;
    width: 80px;
    height: 160px;
    transform: translateX(-50%);
    transition: left 1s, top 1s;
}

.head {
    position: absolute;
    left: 25px;
    top: 0;
    width: 40px;
    height: 40px;
    border: 5px solid #222;
    border-radius: 50%;
    background: #f5d6a0;
}

.body {
    position: absolute;
    left: 43px;
    top: 45px;
    width: 5px;
    height: 65px;
    background: #222;
}

.arm-left,
.arm-right {
    position: absolute;
    top: 55px;
    width: 55px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.arm-left {
    left: 43px;
    transform: rotate(145deg);
}

.arm-right {
    left: 43px;
    transform: rotate(35deg);
}

.leg-left,
.leg-right {
    position: absolute;
    top: 105px;
    left: 43px;
    width: 65px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.leg-left {
    transform: rotate(115deg);
}

.leg-right {
    transform: rotate(65deg);
}

/* HOUSE */

.house {
    position: absolute;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    font-size: 70px;
}

/* MESSAGE */

#message {
    background: white;
    padding: 12px;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>🌳 STICKFOLK 🌳</h1>

<div class="info">
🪵 Wood: <span id="wood">0</span>
&nbsp;&nbsp;
🪨 Stone: <span id="stone">0</span>
&nbsp;&nbsp;
🐟 Food: <span id="food">0</span>
</div>

<div id="game">

    <!-- TREES -->

    <div class="tree tree1" onclick="chopTree(this, 10)">🌲</div>
    <div class="tree tree2" onclick="chopTree(this, 90)">🌲</div>
    <div class="tree tree3" onclick="chopTree(this, 15)">🌲</div>
    <div class="tree tree4" onclick="chopTree(this, 85)">🌲</div>

    <!-- ROCKS -->

    <div class="rock rock1" onclick="mineRock(this, 32)">🪨</div>
    <div class="rock rock2" onclick="mineRock(this, 68)">🪨</div>
    <div class="rock rock3" onclick="mineRock(this, 35)">🪨</div>
    <div class="rock rock4" onclick="mineRock(this, 65)">🪨</div>

    <!-- POND -->

    <div class="pond"></div>

    <!-- FISH -->

    <div class="fish fish1" onclick="gatherFish(this, 8)">🐟</div>
    <div class="fish fish2" onclick="gatherFish(this, 92)">🐟</div>

    <!-- STICKFOLK -->

    <div class="stickman" id="stickman">

        <div class="head"></div>
        <div class="body"></div>

        <div class="arm-left"></div>
        <div class="arm-right"></div>

        <div class="leg-left"></div>
        <div class="leg-right"></div>

    </div>

    <div class="house">🏠</div>

</div>

<div id="message">
    Welcome to your new village!
</div>

<script>

let wood = 0;
let stone = 0;
let food = 0;

const villager = document.getElementById("stickman");

function chopTree(tree, position) {

    villager.style.left = position + "%";

    document.getElementById("message").textContent =
        "🪓 Your Stickfolk is chopping wood...";

    setTimeout(function() {

        wood += 5;

        document.getElementById("wood").textContent = wood;

        tree.style.visibility = "hidden";

        document.getElementById("message").textContent =
            "🪵 Your Stickfolk gathered 5 wood!";

        setTimeout(function() {

            tree.style.visibility = "visible";

            document.getElementById("message").textContent =
                "🌲 The tree has grown back!";

        }, 5000);

    }, 1000);
}

function mineRock(rock, position) {

    villager.style.left = position + "%";

    document.getElementById("message").textContent =
        "⛏️ Your Stickfolk is mining stone...";

    setTimeout(function() {

        stone += 3;

        document.getElementById("stone").textContent = stone;

        rock.style.visibility = "hidden";

        document.getElementById("message").textContent =
            "🪨 Your Stickfolk gathered 3 stone!";

        setTimeout(function() {

            rock.style.visibility = "visible";

            document.getElementById("message").textContent =
                "🪨 The stone has returned!";

        }, 5000);

    }, 1000);
}

function gatherFish(fish, position) {

    villager.style.left = position + "%";

    document.getElementById("message").textContent =
        "🎣 Your Stickfolk is gathering food...";

    setTimeout(function() {

        food += 3;

        document.getElementById("food").textContent = food;

        fish.style.visibility = "hidden";

        document.getElementById("message").textContent =
            "🐟 Your Stickfolk gathered 3 food!";

        setTimeout(function() {

            fish.style.visibility = "visible";

            document.getElementById("message").textContent =
                "🐟 More fish have arrived!";

        }, 5000);

    }, 1000);
}

</script>

</body>
    </html>
