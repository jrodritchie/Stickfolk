<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickfolk</title>

<style>

body {
    margin: 0;
    background: #8fbc70;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    background: #6b8e23;
    color: white;
    margin: 0;
    padding: 20px;
}

.info {
    background: white;
    padding: 15px;
    font-size: 18px;
}

#game {
    position: relative;
    height: 500px;
    overflow: hidden;
}

/* TREES */

.tree {
    position: absolute;
    font-size: 65px;
    cursor: pointer;
}

.tree1 { left: 10%; top: 40px; }
.tree2 { right: 10%; top: 40px; }
.tree3 { left: 15%; bottom: 90px; }
.tree4 { right: 15%; bottom: 90px; }

/* ROCKS */

.rock {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
}

.rock1 { left: 32%; top: 75px; }
.rock2 { right: 32%; top: 75px; }
.rock3 { left: 35%; bottom: 75px; }
.rock4 { right: 35%; bottom: 75px; }

/* POND */

.pond {
    position: absolute;
    left: 50%;
    top: 195px;
    transform: translateX(-50%);
    width: 150px;
    height: 70px;
    background: #62a9d8;
    border-radius: 50%;
    border: 4px solid #4682a9;
}

/* FISH */

.fish {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
}

.fish1 {
    left: 5%;
    top: 210px;
}

.fish2 {
    right: 5%;
    top: 210px;
}

/* STICKFOLK */

.stickman {
    position: absolute;
    left: 50%;
    top: 165px;
    width: 80px;
    height: 160px;
    transform: translateX(-50%);
    transition: left 1s, top 1s;
}

.head {
    position: absolute;
    left: 25px;
    top: 0;
    width: 40px;
    height: 40px;
    border: 5px solid #222;
    border-radius: 50%;
    background: #f5d6a0;
}

.body {
    position: absolute;
    left: 43px;
    top: 45px;
    width: 5px;
    height: 65px;
    background: #222;
}

.arm-left,
.arm-right {
    position: absolute;
    top: 55px;
    width: 55px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.arm-left {
    left: 43px;
    transform: rotate(145deg);
}

.arm-right {
    left: 43px;
    transform: rotate(35deg);
}

.leg-left,
.leg-right {
    position: absolute;
    top: 105px;
    left: 43px;
    width: 65px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.leg-left {
    transform: rotate(115deg);
}

.leg-right {
    transform: rotate(65deg);
}

/* HOUSE */

.house {
    position: absolute;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    font-size: 70px;
}

/* CHICKEN COOP */

.coop {
    position: absolute;
    left: 70%;
    bottom: 20px;
    font-size: 75px;
}

/* COOP PANEL */

#coopPanel {
    background: white;
    padding: 12px;
    font-size: 18px;
}

button {
    margin: 6px;
    padding: 12px 18px;
    font-size: 17px;
    border: none;
    border-radius: 10px;
    background: #6b8e23;
    color: white;
}

button:disabled {
    background: #999;
}

#message {
    background: white;
    padding: 12px;
    font-size: 18px;
}

</style>
</head>

<body>

<h1>🌳 STICKFOLK 🌳</h1>

<div class="info">

🪵 Wood: <span id="wood">0</span>

&nbsp;&nbsp;

🪨 Stone: <span id="stone">0</span>

&nbsp;&nbsp;

🐟 Food: <span id="food">0</span>

&nbsp;&nbsp;

🥚 Eggs: <span id="eggs">0</span>

</div>

<div id="game">

<!-- TREES -->

<div class="tree tree1" onclick="chopTree(this,10)">🌲</div>
<div class="tree tree2" onclick="chopTree(this,90)">🌲</div>
<div class="tree tree3" onclick="chopTree(this,15)">🌲</div>
<div class="tree tree4" onclick="chopTree(this,85)">🌲</div>

<!-- ROCKS -->

<div class="rock rock1" onclick="mineRock(this,32)">🪨</div>
<div class="rock rock2" onclick="mineRock(this,68)">🪨</div>
<div class="rock rock3" onclick="mineRock(this,35)">🪨</div>
<div class="rock rock4" onclick="mineRock(this,65)">🪨</div>

<!-- POND -->

<div class="pond"></div>

<!-- FISH -->

<div class="fish fish1" onclick="gatherFish(this,8)">🐟</div>
<div class="fish fish2" onclick="gatherFish(this,92)">🐟</div>

<!-- STICKFOLK -->

<div class="stickman" id="stickman">

<div class="head"></div>
<div class="body"></div>

<div class="arm-left"></div>
<div class="arm-right"></div>

<div class="leg-left"></div>
<div class="leg-right"></div>

</div>

<!-- HOUSE -->

<div class="house">🏠</div>

<!-- COOP -->

<div class="coop" id="coop">🐔🏠</div>

</div>

<div id="coopPanel">

🐔 Chicken Coop

<br>

Chicken: <span id="chickenStatus">1 chicken</span>

<br>

Status: <span id="coopStatus">Needs food</span>

<br>

<button id="feedButton" onclick="feedChicken()">
🌾 Feed Chicken (5 Food)
</button>

</div>

<div id="message">
Welcome to your new village!
</div>

<script>

let wood = 0;
let stone = 0;
let food = 0;
let eggs = 0;

let chickenFed = false;
let productionReady = false;
let productionTimer = null;

const villager =
document.getElementById("stickman");

function updateResources() {

document.getElementById("wood").textContent = wood;
document.getElementById("stone").textContent = stone;
document.getElementById("food").textContent = food;
document.getElementById("eggs").textContent = eggs;

updateFeedButton();

}

function updateFeedButton() {

const button =
document.getElementById("feedButton");

if (chickenFed) {

button.disabled = true;

if (productionReady) {

button.textContent =
"🥚 Collect Eggs";

} else {

button.textContent =
"🐔 Producing Eggs...";

}

} else {

button.disabled = food < 5;

button.textContent =
"🌾 Feed Chicken (5 Food)";

}

}

/* WOOD */

function chopTree(tree, position) {

villager.style.left =
position + "%";

document.getElementById("message").textContent =
"🪓 Your Stickfolk is chopping wood...";

setTimeout(function() {

wood += 5;

tree.style.visibility =
"hidden";

document.getElementById("message").textContent =
"🪵 Your Stickfolk gathered 5 wood!";

updateResources();

setTimeout(function() {

tree.style.visibility =
"visible";

},5000);

},1000);

}

/* STONE */

function mineRock(rock, position) {

villager.style.left =
position + "%";

document.getElementById("message").textContent =
"⛏️ Your Stickfolk is mining stone...";

setTimeout(function() {

stone += 3;

rock.style.visibility =
"hidden";

document.getElementById("message").textContent =
"🪨 Your Stickfolk gathered 3 stone!";

updateResources();

setTimeout(function() {

rock.style.visibility =
"visible";

},5000);

},1000);

}

/* FOOD */

function gatherFish(fish, position) {

villager.style.left =
position + "%";

document.getElementById("message").textContent =
"🎣 Your Stickfolk is gathering food...";

setTimeout(function() {

food += 3;

fish.style.visibility =
"hidden";

document.getElementById("message").textContent =
"🐟 Your Stickfolk gathered 3 food!";

updateResources();

setTimeout(function() {

fish.style.visibility =
"visible";

},5000);

},1000);

}

/* CHICKEN */

function feedChicken() {

if (!chickenFed && food >= 5) {

food -= 5;

chickenFed = true;
productionReady = false;

document.getElementById("coopStatus").textContent =
"Producing eggs... 4:00";

document.getElementById("message").textContent =
"🐔 The chicken has been fed!";

updateResources();

let seconds = 240;

productionTimer =
setInterval(function() {

seconds--;

let minutes =
Math.floor(seconds / 60);

let remainingSeconds =
seconds % 60;

let displaySeconds =
remainingSeconds < 10
? "0" + remainingSeconds
: remainingSeconds;

document.getElementById("coopStatus").textContent =
"Producing eggs... "
+ minutes + ":"
+ displaySeconds;

if (seconds <= 0) {

clearInterval(productionTimer);

productionReady = true;

document.getElementById("coopStatus").textContent =
"🥚 Eggs are ready!";

document.getElementById("feedButton").disabled =
false;

document.getElementById("feedButton").textContent =
"🥚 Collect Eggs";

}

},1000);

}

else if (chickenFed && productionReady) {

eggs += 3;

chickenFed = false;
productionReady = false;

document.getElementById("coopStatus").textContent =
"Needs food";

document.getElementById("message").textContent =
"🥚 You collected 3 eggs!";

updateResources();

}

}

updateResources();

</script>

</body>
    </html>
