<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickfolk</title>

<style>

body {
    margin: 0;
    background: #8fbc70;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    background: #6b8e23;
    color: white;
    margin: 0;
    padding: 20px;
}

.info {
    background: white;
    padding: 15px;
    font-size: 17px;
}

#game {
    position: relative;
    height: 500px;
    overflow: hidden;
}

/* TREES */

.tree {
    position: absolute;
    font-size: 65px;
    cursor: pointer;
}

.tree1 { left: 8%; top: 35px; }
.tree2 { right: 8%; top: 35px; }
.tree3 { left: 13%; bottom: 90px; }
.tree4 { right: 13%; bottom: 90px; }

/* ROCKS */

.rock {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
}

.rock1 { left: 30%; top: 70px; }
.rock2 { right: 30%; top: 70px; }
.rock3 { left: 33%; bottom: 70px; }
.rock4 { right: 33%; bottom: 70px; }

/* POND */

.pond {
    position: absolute;
    left: 50%;
    top: 190px;
    transform: translateX(-50%);
    width: 150px;
    height: 70px;
    background: #62a9d8;
    border-radius: 50%;
    border: 4px solid #4682a9;
}

/* FISH */

.fish {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
}

.fish1 {
    left: 4%;
    top: 205px;
}

.fish2 {
    right: 4%;
    top: 205px;
}

/* STICKFOLK */

.stickman {
    position: absolute;
    left: 50%;
    top: 160px;
    width: 80px;
    height: 160px;
    transform: translateX(-50%);
    transition: left 1s, top 1s;
}

.head {
    position: absolute;
    left: 25px;
    top: 0;
    width: 40px;
    height: 40px;
    border: 5px solid #222;
    border-radius: 50%;
    background: #f5d6a0;
}

.body {
    position: absolute;
    left: 43px;
    top: 45px;
    width: 5px;
    height: 65px;
    background: #222;
}

.arm-left,
.arm-right {
    position: absolute;
    top: 55px;
    width: 55px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.arm-left {
    left: 43px;
    transform: rotate(145deg);
}

.arm-right {
    left: 43px;
    transform: rotate(35deg);
}

.leg-left,
.leg-right {
    position: absolute;
    top: 105px;
    left: 43px;
    width: 65px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.leg-left {
    transform: rotate(115deg);
}

.leg-right {
    transform: rotate(65deg);
}

/* BUILDINGS */

.house {
    position: absolute;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    font-size: 70px;
}

.coop {
    position: absolute;
    left: 72%;
    bottom: 25px;
    font-size: 65px;
}

.kitchen {
    position: absolute;
    left: 28%;
    bottom: 25px;
    font-size: 65px;
    display: none;
}

/* PANELS */

.panel {
    background: white;
    padding: 10px;
    font-size: 17px;
}

button {
    margin: 6px;
    padding: 11px 16px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #6b8e23;
    color: white;
}

button:disabled {
    background: #999;
}

#message {
    background: white;
    padding: 12px;
    font-size: 18px;
}

</style>
</head>

<body>

<h1>🌳 STICKFOLK 🌳</h1>

<div class="info">

🪵 Wood: <span id="wood">0</span>

&nbsp;&nbsp;

🪨 Stone: <span id="stone">0</span>

&nbsp;&nbsp;

🐟 Food: <span id="food">0</span>

&nbsp;&nbsp;

🥚 Eggs: <span id="eggs">0</span>

&nbsp;&nbsp;

🍽️ Prepared: <span id="prepared">0</span>

</div>

<div id="game">

<!-- TREES -->

<div class="tree tree1" onclick="chopTree(this,8)">🌲</div>
<div class="tree tree2" onclick="chopTree(this,92)">🌲</div>
<div class="tree tree3" onclick="chopTree(this,13)">🌲</div>
<div class="tree tree4" onclick="chopTree(this,87)">🌲</div>

<!-- ROCKS -->

<div class="rock rock1" onclick="mineRock(this,30)">🪨</div>
<div class="rock rock2" onclick="mineRock(this,70)">🪨</div>
<div class="rock rock3" onclick="mineRock(this,33)">🪨</div>
<div class="rock rock4" onclick="mineRock(this,67)">🪨</div>

<!-- POND -->

<div class="pond"></div>

<!-- FISH -->

<div class="fish fish1" onclick="gatherFish(this,7)">🐟</div>
<div class="fish fish2" onclick="gatherFish(this,93)">🐟</div>

<!-- STICKFOLK -->

<div class="stickman" id="stickman">

<div class="head"></div>
<div class="body"></div>

<div class="arm-left"></div>
<div class="arm-right"></div>

<div class="leg-left"></div>
<div class="leg-right"></div>

</div>

<!-- STARTER HOUSE -->

<div class="house">🏠</div>

<!-- CHICKEN COOP -->

<div class="coop" id="coop">🐔🏠</div>

<!-- COMMUNITY KITCHEN -->

<div class="kitchen" id="kitchen">🍳🏠</div>

</div>

<!-- CHICKEN PANEL -->

<div class="panel">

🐔 <b>Chicken Coop</b>

<br>

Chicken: 1

<br>

Status:
<span id="coopStatus">Needs food</span>

<br>

<button id="feedButton" onclick="feedChicken()">
🌾 Feed Chicken (5 Food)
</button>

</div>

<!-- KITCHEN PANEL -->

<div class="panel">

🍳 <b>Community Kitchen</b>

<br>

Status:
<span id="kitchenStatus">Not built</span>

<br>

<button id="buildKitchenButton"
onclick="buildKitchen()">

🍳 Build Kitchen

</button>

<button id="cookButton"
onclick="cookFood()"
disabled>

🍳 Cook 5 Eggs → 5 Food

</button>

</div>

<div id="message">
Welcome to your new village!
</div>

<script>

let wood = 0;
let stone = 0;
let food = 0;
let eggs = 0;
let prepared = 0;

let chickenFed = false;
let productionReady = false;
let kitchenBuilt = false;

let productionTimer = null;

const villager =
document.getElementById("stickman");

function updateResources() {

document.getElementById("wood").textContent = wood;
document.getElementById("stone").textContent = stone;
document.getElementById("food").textContent = food;
document.getElementById("eggs").textContent = eggs;
document.getElementById("prepared").textContent = prepared;

updateFeedButton();
updateKitchenButtons();

}

/* CHICKEN BUTTON */

function updateFeedButton() {

const button =
document.getElementById("feedButton");

if (chickenFed) {

button.disabled = true;

if (productionReady) {

button.textContent =
"🥚 Collect Eggs";

button.disabled = false;

}

else {

button.textContent =
"🐔 Producing Eggs...";

}

}

else {

button.disabled = food < 5;

button.textContent =
"🌾 Feed Chicken (5 Food)";

}

}

/* KITCHEN BUTTONS */

function updateKitchenButtons() {

const buildButton =
document.getElementById("buildKitchenButton");

const cookButton =
document.getElementById("cookButton");

if (!kitchenBuilt) {

buildButton.disabled =
wood < 30 || stone < 15;

cookButton.disabled = true;

}

else {

buildButton.disabled = true;

buildButton.textContent =
"🍳 Kitchen Built!";

cookButton.disabled =
eggs < 5;

}

}

/* WOOD */

function chopTree(tree, position) {

villager.style.left =
position + "%";

document.getElementById("message").textContent =
"🪓 Your Stickfolk is chopping wood...";

setTimeout(function() {

wood += 5;

tree.style.visibility =
"hidden";

document.getElementById("message").textContent =
"🪵 Your Stickfolk gathered 5 wood!";

updateResources();

setTimeout(function() {

tree.style.visibility =
"visible";

},5000);

},1000);

}

/* STONE */

function mineRock(rock, position) {

villager.style.left =
position + "%";

document.getElementById("message").textContent =
"⛏️ Your Stickfolk is mining stone...";

setTimeout(function() {

stone += 3;

rock.style.visibility =
"hidden";

document.getElementById("message").textContent =
"🪨 Your Stickfolk gathered 3 stone!";

updateResources();

setTimeout(function() {

rock.style.visibility =
"visible";

},5000);

},1000);

}

/* FISH */

function gatherFish(fish, position) {

villager.style.left =
position + "%";

document.getElementById("message").textContent =
"🎣 Your Stickfolk is gathering food...";

setTimeout(function() {

food += 3;

fish.style.visibility =
"hidden";

document.getElementById("message").textContent =
"🐟 Your Stickfolk gathered 3 food!";

updateResources();

setTimeout(function() {

fish.style.visibility =
"visible";

},5000);

},1000);

}

/* CHICKEN */

function feedChicken() {

if (!chickenFed && food >= 5) {

food -= 5;

chickenFed = true;
productionReady = false;

document.getElementById("coopStatus").textContent =
"Producing eggs... 4:00";

document.getElementById("message").textContent =
"🐔 The chicken has been fed!";

updateResources();

let seconds = 240;

productionTimer =
setInterval(function() {

seconds--;

let minutes =
Math.floor(seconds / 60);

let remainingSeconds =
seconds % 60;

let displaySeconds =
remainingSeconds < 10
? "0" + remainingSeconds
: remainingSeconds;

document.getElementById("coopStatus").textContent =
"Producing eggs... "
+ minutes + ":"
+ displaySeconds;

if (seconds <= 0) {

clearInterval(productionTimer);

productionReady = true;

document.getElementById("coopStatus").textContent =
"🥚 Eggs are ready!";

updateResources();

}

},1000);

}

else if (chickenFed && productionReady) {

eggs += 3;

chickenFed = false;
productionReady = false;

document.getElementById("coopStatus").textContent =
"Needs food";

document.getElementById("message").textContent =
"🥚 You collected 3 eggs!";

updateResources();

}

}

/* BUILD KITCHEN */

function buildKitchen() {

if (wood < 30 || stone < 15) {

return;

}

wood -= 30;
stone -= 15;

kitchenBuilt = true;

document.getElementById("kitchen").style.display =
"block";

document.getElementById("kitchenStatus").textContent =
"Ready to cook!";

document.getElementById("message").textContent =
"🍳 You built the Community Kitchen!";

updateResources();

}

/* COOK FOOD */

function cookFood() {

if (!kitchenBuilt || eggs < 5) {

return;

}

eggs -= 5;

prepared += 5;

document.getElementById("kitchenStatus").textContent =
"🍽️ Food prepared!";

document.getElementById("message").textContent =
"🍳 The Community Kitchen prepared 5 food!";

updateResources();

}

updateResources();

</script>

</body>
    </html>
