<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickfolk</title>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #dff0d8;
        color: #333;
        text-align: center;
    }

    header {
        background: #6b8e23;
        color: white;
        padding: 12px;
        font-size: 24px;
        font-weight: bold;
    }

    #resources {
        background: #fff;
        padding: 10px;
        font-size: 18px;
        border-bottom: 2px solid #aaa;
    }

    #game {
        position: relative;
        width: 100%;
        max-width: 800px;
        height: 500px;
        margin: auto;
        overflow: hidden;
        background: #8fbc70;
        border: 3px solid #556b2f;
    }

    .tree {
        position: absolute;
        font-size: 55px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s;
    }

    .tree:active {
        transform: scale(0.9);
    }

    #stickfolk {
        position: absolute;
        left: 45%;
        top: 55%;
        font-size: 70px;
        user-select: none;
    }

    #message {
        margin: 10px;
        min-height: 24px;
        font-weight: bold;
    }
