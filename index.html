<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickfolk</title>

<style>
body {
    margin: 0;
    background: #8fbc70;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    background: #6b8e23;
    color: white;
    margin: 0;
    padding: 20px;
}

.info {
    background: white;
    padding: 15px;
    font-size: 22px;
}

#game {
    position: relative;
    height: 500px;
    overflow: hidden;
}

/* TREES */

.tree {
    position: absolute;
    font-size: 65px;
    cursor: pointer;
    user-select: none;
}

.tree1 {
    left: 15%;
    top: 50px;
}

.tree2 {
    right: 15%;
    top: 50px;
}

.tree3 {
    left: 20%;
    bottom: 80px;
}

.tree4 {
    right: 20%;
    bottom: 80px;
}

/* STICKFOLK */

.stickman {
    position: absolute;
    left: 50%;
    top: 170px;
    width: 80px;
    height: 160px;
    transform: translateX(-50%);
    transition: left 1s;
}

/* HEAD */

.head {
    position: absolute;
    left: 25px;
    top: 0;
    width: 40px;
    height: 40px;
    border: 5px solid #222;
    border-radius: 50%;
    background: #f5d6a0;
}

/* BODY */

.body {
    position: absolute;
    left: 43px;
    top: 45px;
    width: 5px;
    height: 65px;
    background: #222;
}

/* ARMS */

.arm-left,
.arm-right {
    position: absolute;
    top: 55px;
    width: 55px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.arm-left {
    left: 43px;
    transform: rotate(145deg);
}

.arm-right {
    left: 43px;
    transform: rotate(35deg);
}

/* LEGS */

.leg-left,
.leg-right {
    position: absolute;
    top: 105px;
    left: 43px;
    width: 65px;
    height: 5px;
    background: #222;
    transform-origin: left center;
}

.leg-left {
    transform: rotate(115deg);
}

.leg-right {
    transform: rotate(65deg);
}

/* MESSAGE */

#message {
    background: white;
    padding: 12px;
    font-size: 18px;
}

.house {
    position: absolute;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    font-size: 80px;
}
</style>
</head>

<body>

<h1>🌳 STICKFOLK 🌳</h1>

<div class="info">
🪵 Wood: <span id="wood">0</span>
&nbsp;&nbsp;
🪨 Stone: 0
&nbsp;&nbsp;
🐟 Food: 0
</div>

<div id="game">

    <div class="tree tree1" onclick="chop(this, 15)">
        🌲
    </div>

    <div class="tree tree2" onclick="chop(this, 75)">
        🌲
    </div>

    <div class="tree tree3" onclick="chop(this, 20)">
        🌲
    </div>

    <div class="tree tree4" onclick="chop(this, 75)">
        🌲
    </div>

    <div class="stickman" id="stickman">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm-left"></div>
        <div class="arm-right"></div>
        <div class="leg-left"></div>
        <div class="leg-right"></div>
    </div>

    <div class="house">🏠</div>

</div>

<div id="message">
    Welcome to your new village!
</div>

<script>

let wood = 0;

function chop(tree, position) {

    const villager = document.getElementById("stickman");

    villager.style.left = position + "%";

    document.getElementById("message").textContent =
        "Your Stickfolk is chopping wood...";

    setTimeout(function() {

        wood += 5;

        document.getElementById("wood").textContent = wood;

        tree.style.visibility = "hidden";

        document.getElementById("message").textContent =
            "🪵 Your Stickfolk gathered 5 wood!";

        setTimeout(function() {
            tree.style.visibility = "visible";

            document.getElementById("message").textContent =
                "🌲 The tree has grown back!";
        }, 5000);

    }, 1000);
}

</script>

</body>
</html>
